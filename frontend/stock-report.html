<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Контроль залишків на складі | MusicStore</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

    <div id="header-placeholder"></div>

    <div class="max-w-5xl mx-auto px-4 py-8 space-y-6">
        
        <nav class="flex text-sm text-gray-500 mb-2" aria-label="Breadcrumb">
            <ol class="flex items-center space-x-2">
                <li><a href="index.html" class="hover:text-blue-600 transition-colors flex items-center gap-1"><i data-lucide="store" class="w-3.5 h-3.5"></i> Магазин</a></li>
                <li><i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i></li>
                <li><a href="admin-dashboard.html" class="hover:text-blue-600 transition-colors flex items-center gap-1"><i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i> Панель</a></li>
                <li><i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i></li>
                <li class="text-gray-900 font-semibold flex items-center gap-1"><i data-lucide="alert-triangle" class="w-3.5 h-3.5 text-orange-600"></i> Контроль складських залишків</li>
            </ol>
        </nav>

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 flex items-center gap-2">
                    <i data-lucide="package-search" class="w-8 h-8 text-orange-500"></i> Звіт «Залишки товарів на складі»
                </h1>
                <p class="text-sm text-gray-500 mt-1">Моніторинг критичного мінімуму складських запасів СУБД</p>
            </div>
            <button onclick="window.print()" class="w-full sm:w-auto px-4 py-2 bg-white hover:bg-gray-50 text-gray-700 font-medium rounded-xl border border-gray-200 transition-all flex items-center justify-center gap-2 cursor-pointer text-sm print:hidden">
                <i data-lucide="printer" class="w-4 h-4"></i> Друк звіту
            </button>
        </div>

        <div class="bg-white p-5 rounded-2xl shadow-sm border border-gray-100 flex flex-col sm:flex-row items-end sm:items-center justify-between gap-4 print:hidden">
            <div class="flex items-center gap-4 flex-1 w-full">
                <div class="w-12 h-12 bg-orange-50 text-orange-600 rounded-xl flex items-center justify-center flex-shrink-0">
                    <i data-lucide="sliders" class="w-5 h-5"></i>
                </div>
                <div class="flex-1">
                    <label class="block text-xs font-bold text-gray-400 uppercase tracking-wider mb-1">Критичний залишок (менше або рівно) *</label>
                    <input type="number" id="criticalLimitInput" value="5" min="0" max="50" class="w-full max-w-xs px-4 py-2 bg-gray-50 border border-gray-200 rounded-lg outline-none font-bold text-sm text-gray-800 focus:ring-2 focus:ring-orange-100 focus:border-orange-400">
                </div>
            </div>
            <button onclick="generateStockReport()" class="w-full sm:w-auto px-6 py-2.5 bg-orange-500 hover:bg-orange-600 text-white font-semibold rounded-lg transition-colors flex items-center justify-center gap-2 cursor-pointer text-sm shadow-sm shadow-orange-500/10">
                <i data-lucide="search" class="w-4 h-4"></i> Просканувати склад
            </button>
        </div>

        <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="p-5 border-b border-gray-100 flex justify-between items-center bg-gray-50/50">
                <span class="font-bold text-gray-900 flex items-center gap-2 text-sm sm:text-base">
                    <i data-lucide="list" class="w-4 h-4 text-gray-400"></i> Складові позиції, що потребують дозакупівлі
                </span>
                <span id="lowStockCountBadge" class="bg-red-50 text-red-700 font-bold py-1 px-3 rounded-full text-xs border border-red-200">0 товарів</span>
            </div>

            <div class="overflow-x-auto">
                <table class="w-full text-left border-collapse min-w-[700px]">
                    <thead class="bg-gray-50">
                        <tr>
                            <th class="py-3.5 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200">Код</th>
                            <th class="py-3.5 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200">Назва моделі</th>
                            <th class="py-3.5 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200">Виробник</th>
                            <th class="py-3.5 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200">Категорія</th>
                            <th class="py-3.5 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200 text-right">Поточна ціна</th>
                            <th class="py-3.5 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200 text-center">Залишок</th>
                        </tr>
                    </thead>
                    <tbody id="stockTableBody" class="divide-y divide-gray-100">
                    </tbody>
                </table>
            </div>
        </div>

    </div>

    <script src="js/header.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/stock-report.js"></script>
</body>
</html>
