<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Особистий кабінет | MusicStore</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

    <div id="header-placeholder"></div>

    <div class="max-w-5xl mx-auto px-4 pt-8 pb-2">
        <a href="catalog.html" class="inline-flex items-center gap-2 text-sm text-gray-500 hover:text-blue-600 transition-colors">
            <i data-lucide="arrow-left" class="w-4 h-4"></i> Повернутися до магазину
        </a>
    </div>

    <div id="profileContent" class="py-4 max-w-5xl mx-auto px-4 hidden">
        <div class="mb-8">
            <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900">Особистий кабінет</h1>
            <p class="text-sm text-gray-500 mt-1">Керуйте своїми даними та відстежуйте статуси замовлень з БД</p>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-12 gap-8">
            
            <div class="md:col-span-4 space-y-6">
                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 text-center">
                    <div id="userInitial" class="w-24 h-24 bg-blue-100 text-blue-700 rounded-full flex items-center justify-center text-3xl font-bold mx-auto mb-4"></div>
                    <h2 id="userNameTop" class="text-xl font-bold text-gray-900">Ім'я</h2>
                    <p id="userEmailTop" class="text-sm text-gray-500 mb-2">email</p>
                    <span class="text-xs text-gray-400 bg-gray-50 py-1.5 px-3 rounded-full inline-block">Покупець MusicStore</span>
                </div>

                <div class="bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
                    <nav class="flex flex-col">
                        <button onclick="switchProfileTab('info')" id="tabBtn-info" class="profile-tab-btn flex items-center gap-3 px-6 py-4 text-sm font-medium border-l-4 border-blue-600 bg-blue-50 text-blue-600 transition-all w-full text-left cursor-pointer">
                            <i data-lucide="user" class="w-5 h-5"></i> Особисті дані
                        </button>
                        <button onclick="switchProfileTab('orders')" id="tabBtn-orders" class="profile-tab-btn flex items-center gap-3 px-6 py-4 text-sm font-medium border-l-4 border-transparent text-gray-600 hover:bg-gray-50 transition-all w-full text-left cursor-pointer">
                            <i data-lucide="package" class="w-5 h-5"></i> Історія замовлений
                        </button>
                        <button onclick="handleLogout()" class="flex items-center gap-3 px-6 py-4 text-sm font-medium text-red-600 hover:bg-red-50 transition-colors border-l-4 border-transparent w-full text-left cursor-pointer">
                            <i data-lucide="log-out" class="w-5 h-5"></i> Вийти з акаунту
                        </button>
                    </nav>
                </div>
            </div>

            <div class="md:col-span-8">
                
                <div id="profileTab-info" class="profile-tab-content bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8">
                    <h3 class="text-xl font-bold text-gray-900 mb-6">Особисті дані</h3>
                    
                    <form id="profileUpdateForm" class="space-y-4">
                        <div class="grid grid-cols-2 gap-4">
                            <div>
                                <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Ім'я</label>
                                <input type="text" id="profileFirstName" required class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm">
                            </div>
                            <div>
                                <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Прізвище</label>
                                <input type="text" id="profileLastName" required class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm">
                            </div>
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Телефон</label>
                            <input type="tel" id="profilePhone" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Email (Незмінний)</label>
                            <input type="email" id="profileEmail" disabled class="w-full px-4 py-2 border border-gray-200 bg-gray-50 rounded-lg text-gray-400 outline-none text-sm cursor-not-allowed">
                        </div>
                        <div>
                            <label class="block text-xs font-bold text-gray-600 uppercase tracking-wider mb-1">Адреса доставки (Зберігається в БД)</label>
                            <input type="text" id="profileAddress" placeholder="Вкажіть ваше місто та номер відділення Нової Пошти" class="w-full px-4 py-2 border border-gray-200 rounded-lg focus:ring-2 focus:ring-blue-100 focus:border-blue-500 outline-none transition-all text-sm">
                        </div>
                        
                        <div class="pt-2">
                            <button type="submit" id="saveProfileBtn" class="bg-blue-600 hover:bg-blue-700 text-white font-bold px-6 py-2.5 rounded-xl transition-all shadow-sm shadow-blue-600/10 active:scale-95 cursor-pointer text-sm">
                                Зберегти зміни
                            </button>
                        </div>
                    </form>
                </div>

                <div id="profileTab-orders" class="profile-tab-content bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8 hidden">
                    <h3 class="text-xl font-bold text-gray-900 mb-6">Історія ваших замовлень</h3>
                    
                    <div id="ordersContentWrapper">
                        <div class="flex justify-center items-center py-12">
                            <div class="w-8 h-8 border-4 border-blue-600 border-t-transparent rounded-full animate-spin"></div>
                        </div>
                    </div>
                </div>

            </div>
        </div>
    </div>

    <script src="js/header.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/profile.js"></script> </body>
</html>
