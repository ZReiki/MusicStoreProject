<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Аналіз активності клієнтів | MusicStore</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">

    <div id="header-placeholder"></div>

    <div class="max-w-5xl mx-auto px-4 py-8 space-y-6">
        
        <nav class="flex text-sm text-gray-500 mb-2" aria-label="Breadcrumb">
            <ol class="flex items-center space-x-2">
                <li><a href="index.html" class="hover:text-blue-600 transition-colors flex items-center gap-1"><i data-lucide="store" class="w-3.5 h-3.5"></i> Магазин</a></li>
                <li><i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i></li>
                <li><a href="admin-dashboard.html" class="hover:text-blue-600 transition-colors flex items-center gap-1"><i data-lucide="layout-dashboard" class="w-3.5 h-3.5"></i> Панель</a></li>
                <li><i data-lucide="chevron-right" class="w-4 h-4 text-gray-400"></i></li>
                <li class="text-gray-900 font-semibold flex items-center gap-1"><i data-lucide="users" class="w-3.5 h-3.5 text-emerald-600"></i> Аналітика клієнтів</li>
            </ol>
        </nav>

        <div class="flex flex-col sm:flex-row sm:items-center justify-between gap-4">
            <div>
                <h1 class="text-2xl sm:text-3xl font-extrabold text-gray-900 flex items-center gap-2">
                    <i data-lucide="users-2" class="w-8 h-8 text-emerald-600"></i> Звіт «Активність клієнтів»
                </h1>
                <p class="text-sm text-gray-500 mt-1">Рейтинг покупців та автоматична сегментація аудиторії за обсягами покупок</p>
            </div>
            <button onclick="window.print()" class="w-full sm:w-auto px-4 py-2 bg-white hover:bg-gray-50 text-gray-700 font-medium rounded-xl border border-gray-200 transition-all flex items-center justify-center gap-2 cursor-pointer text-sm print:hidden">
                <i data-lucide="printer" class="w-4 h-4"></i> Експорт / Друк
            </button>
        </div>

        <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-gray-100 flex flex-col items-center justify-center min-h-[340px]">
                <h3 class="text-xs font-bold text-gray-400 uppercase tracking-wider mb-4 text-center">Структура бази клієнтів</h3>
                <div class="w-full max-w-[210px] h-[210px] flex items-center justify-center">
                    <canvas id="customerSegmentsChart"></canvas>
                </div>
            </div>

            <div class="md:col-span-2 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden flex flex-col">
                <div class="p-5 border-b border-gray-100 font-bold text-gray-900 text-sm sm:text-base bg-gray-50/50 flex items-center justify-between">
                    <span><i data-lucide="medal" class="w-4 h-4 text-gray-400 inline mr-1"></i> Топ покупців за фінансовим внеском</span>
                    <span id="totalCustomersBadge" class="bg-emerald-50 text-emerald-700 font-bold py-0.5 px-2.5 border border-emerald-200 rounded-full text-xs">0 контрагентів</span>
                </div>
                <div class="overflow-x-auto flex-1">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-50">
                            <tr>
                                <th class="py-3 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200">Покупець</th>
                                <th class="py-3 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200">Контакти</th>
                                <th class="py-3 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200 text-center">Замовлень</th>
                                <th class="py-3 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200 text-right">Разом витрачено</th>
                                <th class="py-3 px-6 text-xs font-bold text-gray-500 uppercase border-b border-gray-200 text-center">Сегмент</th>
                            </tr>
                        </thead>
                        <tbody id="customerTableBody" class="divide-y divide-gray-100"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="js/header.js"></script>
    <script src="js/toast.js"></script>
    <script src="js/customer-report.js"></script>
</body>
</html>
