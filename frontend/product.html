<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Деталі товару | MusicStore</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div id="header-placeholder"></div>

    <div class="max-w-7xl mx-auto px-4 py-8">
        
        <nav class="flex text-sm text-gray-500 mb-8" aria-label="Breadcrumb">
            <ol class="flex items-center space-x-2" id="breadcrumbs">
            </ol>
        </nav>

        <div class="flex flex-col lg:flex-row gap-10 bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-gray-100">
            
            <div class="w-full lg:w-1/2 flex flex-col gap-4">
                <div class="aspect-[4/3] w-full rounded-xl overflow-hidden bg-gray-50 border border-gray-100 flex items-center justify-center relative">
                    <img id="mainImage" src="" alt="" class="w-full h-full object-cover">
                </div>
                <div class="flex gap-4 overflow-x-auto pb-2" id="thumbnailsContainer">
                </div>
            </div>

            <div class="w-full lg:w-1/2 flex flex-col">
                <div class="mb-2 flex items-center gap-2">
                    <span id="productBrand" class="text-xs font-bold uppercase tracking-wider text-blue-700 bg-blue-50 px-2.5 py-1 rounded-md"></span>
                    <div class="flex items-center" id="ratingStarsTop">
                    </div>
                </div>
                
                <h1 id="productName" class="text-3xl sm:text-4xl font-extrabold text-gray-900 leading-tight mb-4"></h1>

                <div class="flex items-baseline gap-4 mb-6">
                    <span id="productPrice" class="text-4xl font-bold text-gray-900"></span>
                </div>

                <div class="mb-8 p-4 bg-gray-50 rounded-xl border border-gray-100 flex flex-col gap-2">
                    <div class="flex items-center gap-2 text-sm font-medium" id="stockStatus">
                    </div>
                    <p id="productSku" class="text-sm text-gray-500 ml-7"></p>
                </div>

                <div class="flex flex-col sm:flex-row gap-4 mt-auto">
                    <button onclick="handleQuickBuy()" class="flex-1 bg-green-50 text-green-700 hover:bg-green-100 border border-green-200 px-6 py-4 rounded-xl font-bold text-lg flex items-center justify-center gap-2 transition-colors active:scale-95 cursor-pointer">
                        <i data-lucide="zap" class="w-5 h-5"></i> Купити в один клік
                    </button>
                    
                    <div id="cartButtonContainer" class="flex-1"></div>
                </div>
            </div>
        </div>

        <div class="mt-10 bg-white rounded-2xl shadow-sm border border-gray-100 overflow-hidden">
            <div class="flex overflow-x-auto border-b border-gray-200 bg-gray-50/50 px-2 sm:px-6">
                <button onclick="switchTab('description')" id="tabBtn-description" class="tab-btn px-6 py-5 font-semibold text-sm sm:text-base border-b-2 whitespace-nowrap transition-colors border-blue-600 text-blue-600 cursor-pointer">
                    Опис
                </button>
                <button onclick="switchTab('specs')" id="tabBtn-specs" class="tab-btn px-6 py-5 font-semibold text-sm sm:text-base border-b-2 whitespace-nowrap transition-colors border-transparent text-gray-600 hover:text-gray-900 cursor-pointer">
                    Характеристики
                </button>
                <button onclick="switchTab('reviews')" id="tabBtn-reviews" class="tab-btn px-6 py-5 font-semibold text-sm sm:text-base border-b-2 whitespace-nowrap transition-colors border-transparent text-gray-600 hover:text-gray-900 flex items-center gap-2 cursor-pointer">
                    Відгуки <span id="reviewsCountBadge" class="bg-gray-200 text-gray-700 py-0.5 px-2 rounded-full text-xs">0</span>
                </button>
            </div>

            <div class="p-6 sm:p-8 min-h-[300px]" id="tabContent">
            </div>
        </div>

    </div>

    <script src="js/header.js"></script>
    <script src="js/toast.js"></script> <script src="js/product.js"></script>
</body>
</html>
