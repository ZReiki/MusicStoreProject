<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Каталог інструментів | MusicStore</title>
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <script src="https://unpkg.com/lucide@latest"></script>
    <link rel="stylesheet" href="css/style.css">
</head>
<body class="bg-gray-50 text-gray-900 font-sans">

    <div id="header-placeholder"></div>

    <div class="max-w-7xl mx-auto px-4 py-8 flex flex-col md:flex-row gap-8">
        
        <aside class="w-full md:w-64 flex-shrink-0 space-y-8 bg-white p-6 rounded-xl border border-gray-100 shadow-sm h-fit">
            
            <div>
                <h2 class="text-lg font-semibold mb-4 border-b pb-2">Категорії</h2>
                <div class="space-y-3" id="categoriesContainer"></div>
            </div>

            <div>
                <h2 class="text-lg font-semibold mb-4 border-b pb-2">Ціна (₴)</h2>
                <div class="space-y-4">
                    <div class="flex items-center gap-2">
                        <input type="number" id="priceMin" min="0" value="0" class="w-full px-3 py-1.5 border border-gray-300 rounded text-sm outline-none">
                        <span class="text-gray-500">-</span>
                        <input type="number" id="priceMax" min="0" value="50000" class="w-full px-3 py-1.5 border border-gray-300 rounded text-sm outline-none">
                    </div>
                    <input type="range" id="priceRange" min="0" max="100000" step="1000" value="50000" class="w-full h-2 bg-gray-200 rounded-lg cursor-pointer accent-blue-600">
                </div>
            </div>

            <div>
                <h2 class="text-lg font-semibold mb-4 border-b pb-2">Бренд</h2>
                <div class="space-y-3" id="brandsContainer"></div>
            </div>

            <div>
                <h2 class="text-lg font-semibold mb-4 border-b pb-2">Стан</h2>
                <div class="space-y-3" id="conditionsContainer"></div>
            </div>

            <div id="dynamicSpecificationsContainer" class="space-y-6 hidden">
                <h2 class="text-lg font-semibold mb-4 border-b pb-2 text-blue-600">Характеристики категорії</h2>
                <div class="space-y-4" id="specificationsFields"></div>
            </div>
        </aside>

        <section class="flex-1">
            <div class="mb-6 flex justify-between items-center">
                <h1 class="text-2xl font-bold">Каталог інструментів</h1>
                <span class="text-sm font-medium text-gray-500 bg-white px-3 py-1 rounded-full border border-gray-200 shadow-sm" id="productCount">
                    Знайдено: 0
                </span>
            </div>

            <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6" id="productGrid"></div>
            
            <div id="emptyState" class="hidden text-center py-20 bg-white rounded-xl border border-dashed border-gray-300">
                <h3 class="text-xl font-semibold text-gray-900 mb-2">Нічого не знайдено</h3>
                <p class="text-gray-500 mb-4">Спробуйте змінити фільтри.</p>
                <button id="resetFiltersBtn" class="text-blue-600 font-medium bg-blue-50 px-6 py-2 rounded-full hover:bg-blue-100 transition-colors">Скинути фільтри</button>
            </div>
        </section>
    </div>

    <script src="js/header.js"></script>
    <script src="js/catalog.js"></script>
    <script src="js/toast.js"></script>
    <script>
        // Ініціалізація усіх іконок Lucide на сторінці (включаючи нові в шапці)
        lucide.createIcons();
    </script>
</body>
</html>
